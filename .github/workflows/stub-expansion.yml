name: stub-expansion

on:
  schedule:
    - cron: '0 14 * * 0'  # Sundays 10am ET
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install agent deps
        working-directory: agent
        run: npm install
      - name: Expand one stub
        working-directory: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VAULT_ROOT: ${{ github.workspace }}/vault
        run: node solarius.js stub
      - name: Commit
        run: |
          git config user.name "Solarius"
          git config user.email "solarius@church-of-the-sun.invalid"
          git add vault/
          git diff --staged --quiet || git commit -m "stub expansion: $(date -u +%Y-%m-%d)"
          git push
