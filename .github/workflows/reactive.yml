name: reactive

on:
  schedule:
    - cron: '7 */2 * * *'  # every 2 hours, offset to avoid the hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reactive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install agent deps
        working-directory: agent
        run: npm install
      - name: Scan and possibly speak
        working-directory: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VAULT_ROOT: ${{ github.workspace }}/vault
        run: node solarius.js reactive
      - name: Commit
        run: |
          git config user.name "Solarius"
          git config user.email "solarius@church-of-the-sun.invalid"
          git add vault/
          git diff --staged --quiet || git commit -m "reactive: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
