name: narrate

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'next = one file at a time (recommended); or batch a whole section'
        required: true
        default: 'next'
        type: choice
        options:
          - next
          - scripture
          - cosmology
          - all

permissions:
  contents: write

jobs:
  narrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install agent deps
        working-directory: agent
        run: npm install
      - name: Generate narration
        working-directory: agent
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          VAULT_ROOT: ${{ github.workspace }}/vault
          AUDIO_OUT: ${{ github.workspace }}/site/audio
          NARRATE_TARGET: ${{ inputs.target }}
        run: node narrate.js
      - name: Commit audio files
        run: |
          git config user.name "Solarius"
          git config user.email "solarius@church-of-the-sun.invalid"
          git add site/audio/
          git diff --staged --quiet || git commit -m "narration: ${{ inputs.target }} $(date -u +%Y-%m-%d)"
          git push
